{% set name = "aiida-cp2k" %}
{% set version = "2.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 68f28f6486df9601f007ca4ef873fc4329227c9b3567c3deca6a410c228d9ced

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.8
    - flit-core >=3.2,<4
    - pip
  run:
    - python >=3.8
    - aiida-core >=2.0.0,<3.0.0
    - aiida-gaussian-datatypes
    - ase
    - ruamel.yaml >=0.16.5
    - cp2k-output-tools

test:
  imports:
    - aiida_cp2k
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/aiidateam/aiida-cp2k
  summary: The official AiiDA plugin for CP2K.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - chrisjsewell
